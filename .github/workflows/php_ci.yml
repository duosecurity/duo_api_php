name: PHP CI
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  ci:
    name: PHP CI - test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php: [8.2, 8.3, 8.4, 8.5]

    steps:
      - name: Install additional packages
        run: sudo apt-get install -y stunnel

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    
      - name: Setup PHP
        uses: cisco-actions-ghe/shivammathur-setup-php@da45391f4d4bb37f250927c46090c47a69442268 # 2.36.0
        with:
          php-version: ${{ matrix.php }}
          coverage: xdebug
    
      - name: Composer install
        run: composer install
   
      - name: PHP tests
        run: ./vendor/bin/phpunit

  ci_success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [ci]
    steps:
      - run: echo "All CI jobs passed successfully"
